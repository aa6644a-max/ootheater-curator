<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오오극장 — 독립영화 기획전 큐레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:       #0f0f0f;
  --surface:  #181818;
  --surface2: #222;
  --border:   #2c2c2c;
  --text:     #e4e4e4;
  --muted:    #5a5a5a;
  --accent:   #c8a96e;
  --accent2:  #5b8dd9;
  --danger:   #c0392b;
  --font:     "Noto Serif KR", serif;
  --mono:     "DM Mono", monospace;
  --sidebar:  220px;
  --ease:     0.15s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
.sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-head {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sb-logo { font-size: 0.95rem; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
.sb-sub  { font-size: 0.62rem; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

.sb-label {
  padding: 14px 16px 6px;
  font-size: 0.58rem;
  font-family: var(--mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0;
}
.sb-list::-webkit-scrollbar { width: 3px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--text);
  transition: background var(--ease);
  position: relative;
  user-select: none;
}
.cat-item:hover { background: var(--surface2); }
.cat-item.active {
  background: var(--surface2);
  color: var(--accent);
}
.cat-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
}
.cat-chevron { font-size: 0.55rem; opacity: 0.4; }
.cat-name    { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-count   { font-size: 0.62rem; color: var(--muted); font-family: var(--mono); flex-shrink: 0; }
.cat-del {
  opacity: 0;
  color: var(--danger);
  font-size: 0.65rem;
  cursor: pointer;
  padding: 2px 4px;
  transition: opacity var(--ease);
  flex-shrink: 0;
}
.cat-item:hover .cat-del { opacity: 0.7; }
.cat-item:hover .cat-del:hover { opacity: 1; }

.sb-foot {
  border-top: 1px solid var(--border);
  padding: 12px;
}
.btn-new-cat {
  width: 100%;
  background: none;
  border: 1px dashed var(--border);
  color: var(--muted);
  padding: 8px;
  font-size: 0.72rem;
  cursor: pointer;
  border-radius: 3px;
  font-family: var(--font);
  transition: all var(--ease);
}
.btn-new-cat:hover { border-color: var(--accent); color: var(--accent); }

/* ═══════════════════════════════════════
   MAIN
═══════════════════════════════════════ */
.main {
  flex: 1;
  min-width: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── 검색 홈 화면 ── */
#homeScreen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
}
.home-title {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.home-sub {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 36px;
  font-family: var(--mono);
}
.search-wrap {
  display: flex;
  width: 100%;
  max-width: 580px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  transition: border-color var(--ease);
}
.search-wrap:focus-within { border-color: var(--accent); }
.search-wrap input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 14px 18px;
  font-size: 1rem;
  color: var(--text);
  font-family: var(--font);
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap button {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 0 22px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  border-radius: 0 2px 2px 0;
  font-family: var(--font);
  transition: opacity var(--ease);
  letter-spacing: 0.02em;
}
.search-wrap button:hover { opacity: 0.85; }

.search-type {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.search-type button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 0 12px;
  font-size: 0.72rem;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
  white-space: nowrap;
  height: 100%;
}
.search-type button.active {
  background: var(--surface2);
  color: var(--accent);
}
.search-type button:hover:not(.active) { color: var(--text); }

/* ── 결과 화면 ── */
#resultsScreen {
  display: none;
  flex-direction: column;
  height: 100%;
}
.results-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.btn-back {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 12px;
  font-size: 0.72rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: all var(--ease);
  white-space: nowrap;
}
.btn-back:hover { color: var(--text); border-color: var(--text); }
.results-search {
  display: flex;
  flex: 1;
  max-width: 460px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
}
.results-search:focus-within { border-color: var(--accent); }
.results-search input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 7px 14px;
  font-size: 0.88rem;
  color: var(--text);
  font-family: var(--font);
}
.results-search input::placeholder { color: var(--muted); }
.results-search button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 0 12px;
  cursor: pointer;
  font-size: 0.7rem;
  font-family: var(--mono);
  transition: color var(--ease);
}
.results-search button:hover { color: var(--text); }
.results-stat {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  white-space: nowrap;
  margin-left: auto;
}

.movie-grid {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  align-content: start;
  align-items: start;
}
.movie-grid::-webkit-scrollbar { width: 4px; }
.movie-grid::-webkit-scrollbar-thumb { background: var(--border); }

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.pagination:empty { display: none; }
.pg-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  font-size: 0.72rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
}
.pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pg-btn:disabled { opacity: 0.3; cursor: default; }
.pg-btn.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
.pg-info {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  padding: 0 6px;
}

/* ── 카테고리 뷰 ── */
#catScreen {
  display: none;
  flex-direction: column;
  height: 100%;
}
.cat-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.cat-bar-title { font-size: 0.95rem; font-weight: 600; flex: 1; }
.cat-bar-count { font-size: 0.68rem; color: var(--muted); font-family: var(--mono); }

/* ═══════════════════════════════════════
   MOVIE CARD
═══════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--ease), transform var(--ease);
  position: relative;
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); z-index: 1; }

.card-poster {
  aspect-ratio: 3/4;
  background: var(--surface2);
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
.card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.no-poster {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  padding: 12px;
  box-sizing: border-box;
}
.no-poster .np-title {
  color: rgba(255,255,255,0.85);
  font-size: 0.8rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.4;
  word-break: keep-all;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.no-poster svg { flex-shrink: 0; opacity: 0.35; }

.card-rm {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(0,0,0,0.75);
  border: none;
  color: var(--danger);
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.7rem;
  display: none;
  align-items: center;
  justify-content: center;
  transition: opacity var(--ease);
}
#catScreen .card:hover .card-rm { display: flex; }

/* 제목·감독 오버레이 — 포스터 하단에 그라디언트 위에 표시 */
.card-body {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 28px 10px 9px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
  color: #fff;
}
.card-meta {
  font-size: 0.64rem;
  color: rgba(255,255,255,0.65);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--mono);
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
  overflow-y: auto;
}
.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 100%;
  max-width: 800px;
  position: relative;
  animation: fadeUp 0.15s ease;
  margin: auto;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-x {
  position: absolute;
  top: 12px; right: 14px;
  background: none; border: none;
  color: var(--muted); font-size: 1rem;
  cursor: pointer; z-index: 1;
  transition: color var(--ease);
}
.modal-x:hover { color: var(--text); }

.modal-hero {
  display: flex;
  gap: 24px;
  padding: 24px;
}
.modal-poster {
  width: 150px;
  min-width: 150px;
  aspect-ratio: 2/3;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-poster-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 0.65rem; font-family: var(--mono);
}

.modal-info { flex: 1; min-width: 0; }
.modal-title {
  font-size: 1.45rem;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 14px;
}

.meta-table {
  display: grid;
  grid-template-columns: 68px 1fr;
  gap: 6px 10px;
  font-size: 0.76rem;
  margin-bottom: 14px;
}
.meta-k { color: var(--muted); }
.meta-v { color: var(--text); }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 16px;
}
.tag {
  padding: 2px 8px;
  font-size: 0.62rem;
  border-radius: 2px;
  font-family: var(--mono);
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--surface2);
}
.tag.festival { border-color: var(--accent2); color: var(--accent2); }

.add-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.cat-sel {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.78rem;
  border-radius: 3px;
  font-family: var(--font);
  outline: none;
  cursor: pointer;
}
.cat-sel:focus { border-color: var(--accent); }
.btn-add {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 8px 18px;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: opacity var(--ease);
  white-space: nowrap;
}
.btn-add:hover { opacity: 0.85; }
.btn-add:disabled { opacity: 0.35; cursor: default; }

.modal-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

.modal-section { padding: 16px 24px; }
.section-label {
  font-size: 0.6rem;
  font-family: var(--mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.plot-text {
  font-size: 0.82rem;
  line-height: 1.85;
  color: #b8b8b8;
}

.stills-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.stills-scroll::-webkit-scrollbar { height: 3px; }
.stills-scroll::-webkit-scrollbar-thumb { background: var(--border); }
.stills-scroll img {
  height: 120px;
  border-radius: 3px;
  object-fit: cover;
  flex-shrink: 0;
  cursor: zoom-in;
  transition: opacity var(--ease);
}
.stills-scroll img:hover { opacity: 0.85; }

/* ═══════════════════════════════════════
   DIALOG (새 카테고리)
═══════════════════════════════════════ */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.dialog-overlay.open { display: flex; }

.dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 24px;
  width: 360px;
}
.dialog h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 14px; }
.dialog input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  font-size: 0.85rem;
  border-radius: 3px;
  font-family: var(--font);
  outline: none;
  margin-bottom: 14px;
}
.dialog input:focus { border-color: var(--accent); }
.dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 7px 14px;
  font-size: 0.76rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: all var(--ease);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text); }

.btn-primary {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 7px 16px;
  font-size: 0.76rem;
  font-weight: 700;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: opacity var(--ease);
}
.btn-primary:hover { opacity: 0.85; }

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  font-size: 0.76rem;
  border-radius: 3px;
  z-index: 9999;
  display: none;
  font-family: var(--mono);
  pointer-events: none;
}
.toast.show { display: block; animation: fadeUp 0.15s ease; }
.toast.ok   { border-color: var(--accent); }
.toast.err  { border-color: var(--danger); }

/* ═══════════════════════════════════════
   공용
═══════════════════════════════════════ */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 0.82rem;
  font-family: var(--mono);
  line-height: 1.8;
}
</style>
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<nav class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">오오극장</div>
    <div class="sb-sub">독립영화 기획전 큐레이터</div>
  </div>
  <div class="sb-label">내 카테고리</div>
  <div class="sb-list" id="catList"></div>
  <div class="sb-foot">
    <button class="btn-new-cat" id="btnNewCat">+ 새 카테고리</button>
  </div>
</nav>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main">

  <!-- 홈 검색 화면 -->
  <div id="homeScreen">
    <div class="home-title">오오극장 큐레이터</div>
    <div class="home-sub">영화를 검색하고 기획전 카테고리에 추가하세요</div>
    <div style="display:flex;gap:8px;width:100%;max-width:580px;align-items:stretch">
      <div class="search-type" id="homeSearchType">
        <button class="active" data-type="title">제목</button>
        <button data-type="director">감독</button>
      </div>
      <div class="search-wrap" style="flex:1;max-width:none">
        <input id="homeInput" type="text" placeholder="영화 제목으로 검색…" autocomplete="off" />
        <button id="homeBtn">검색</button>
      </div>
    </div>
  </div>

  <!-- 검색 결과 화면 -->
  <div id="resultsScreen">
    <div class="results-bar">
      <button class="btn-back" id="backBtn">← 홈</button>
      <div class="search-type" id="topSearchType">
        <button class="active" data-type="title">제목</button>
        <button data-type="director">감독</button>
      </div>
      <div class="results-search">
        <input id="topInput" type="text" placeholder="다시 검색…" autocomplete="off" />
        <button id="topBtn">검색</button>
      </div>
      <div class="results-stat" id="resStat"></div>
    </div>
    <div class="movie-grid" id="resGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- 카테고리 뷰 화면 -->
  <div id="catScreen">
    <div class="cat-bar">
      <button class="btn-back" id="catBackBtn">← 홈</button>
      <div class="cat-bar-title" id="catBarTitle"></div>
      <div class="cat-bar-count" id="catBarCount"></div>
    </div>
    <div class="movie-grid" id="catGrid"></div>
    <div class="pagination" id="catPagination"></div>
  </div>

</main>

<!-- ═══════════ MODAL ═══════════ -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-x" id="modalX">✕</button>
    <div class="modal-hero">
      <div class="modal-poster" id="mPoster"></div>
      <div class="modal-info">
        <div class="modal-title" id="mTitle"></div>
        <div class="meta-table" id="mMeta"></div>
        <div class="tag-row" id="mTags"></div>
        <div class="add-row">
          <select class="cat-sel" id="mCatSel">
            <option value="">카테고리 선택…</option>
          </select>
          <button class="btn-add" id="mAddBtn">추가</button>
        </div>
      </div>
    </div>
    <hr class="modal-divider" />
    <div id="mPlot" class="modal-section" style="display:none">
      <div class="section-label">줄거리</div>
      <div class="plot-text" id="mPlotText"></div>
    </div>
    <div id="mStills" class="modal-section" style="display:none">
      <div class="section-label">스틸컷</div>
      <div class="stills-scroll" id="mStillsRow"></div>
    </div>
  </div>
</div>

<!-- ═══════════ NEW CAT DIALOG ═══════════ -->
<div class="dialog-overlay" id="dlgOverlay">
  <div class="dialog">
    <h3>새 카테고리 만들기</h3>
    <input id="dlgInput" type="text" placeholder="예: 전주영화제 상영작" maxlength="40" />
    <div class="dialog-btns">
      <button class="btn-ghost" id="dlgCancel">취소</button>
      <button class="btn-primary" id="dlgOk">만들기</button>
    </div>
  </div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div class="toast" id="toast"></div>

<script>
/* ── 전역 상태 ─────────────────────────────── */
let categories       = [];
let activeCatId      = null;
let currentMovie     = null;
let searchType       = "title"; // "title" | "director"
let allSearchResults = [];
let searchPage       = 1;
let allCatMovies     = [];
let allCatRows       = [];
let catPage          = 1;
const PAGE_SIZE      = 12;

/* ── 유틸 ──────────────────────────────────── */
let toastTimer;
function toast(msg, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

function showScreen(name) {
  document.getElementById("homeScreen").style.display    = name === "home"    ? "" : "none";
  document.getElementById("resultsScreen").style.display = name === "results" ? "flex" : "none";
  document.getElementById("catScreen").style.display     = name === "cat"     ? "flex" : "none";
}

const FESTIVAL_WORDS = ["전주", "부산", "서울", "부천", "제주", "인디", "독립", "다큐", "iff", "독립영화"];

/* ── 카테고리 API ───────────────────────────── */
async function apiGet(url)          { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function apiPost(url, body)   { const r = await fetch(url, { method:"POST",  headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); if (!r.ok) { let msg = r.status; try { const d = await r.json(); msg = d.error || d.message || d.hint || JSON.stringify(d); } catch {} throw new Error(msg); } return r.json(); }
async function apiDelete(url)       { const r = await fetch(url, { method:"DELETE" }); if (!r.ok) throw new Error(r.status); }

async function loadCategories() {
  try {
    categories = await apiGet("/api/categories");
    renderSidebar();
  } catch { /* 무시 */ }
}

/* ── 사이드바 ───────────────────────────────── */
function renderSidebar() {
  const list = document.getElementById("catList");
  if (!categories.length) {
    list.innerHTML = `<div style="padding:16px;font-size:0.72rem;color:var(--muted);font-family:var(--mono)">카테고리 없음</div>`;
    updateCatSel();
    return;
  }
  list.innerHTML = categories.map(c => `
    <div class="cat-item${activeCatId === c.id ? " active" : ""}" data-id="${c.id}">
      <span class="cat-chevron">▶</span>
      <span class="cat-name">${c.name}</span>
      <span class="cat-count">${c.movie_count || 0}</span>
      <span class="cat-del" data-del="${c.id}">✕</span>
    </div>`).join("");

  list.querySelectorAll(".cat-item").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.dataset.del) return;
      openCatView(el.dataset.id);
    });
  });

  list.querySelectorAll(".cat-del").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const id   = btn.dataset.del;
      const cat  = categories.find(c => c.id === id);
      if (!confirm(`"${cat?.name}" 카테고리를 삭제하시겠습니까?`)) return;
      try {
        await apiDelete(`/api/categories?id=${id}`);
        categories = categories.filter(c => c.id !== id);
        if (activeCatId === id) { activeCatId = null; showScreen("home"); }
        renderSidebar();
        toast("카테고리 삭제됨");
      } catch { toast("삭제 실패", "err"); }
    });
  });

  updateCatSel();
}

function updateCatSel() {
  document.getElementById("mCatSel").innerHTML =
    `<option value="">카테고리 선택…</option>` +
    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

/* ── 검색 타입 토글 ─────────────────────────── */
function initSearchTypeToggle(groupId, inputId) {
  const group = document.getElementById(groupId);
  const input = document.getElementById(inputId);
  group.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      searchType = btn.dataset.type;
      // 양쪽 토글 동기화
      ["homeSearchType", "topSearchType"].forEach(id => {
        document.getElementById(id)?.querySelectorAll("button").forEach(b => {
          b.classList.toggle("active", b.dataset.type === searchType);
        });
      });
      // placeholder 업데이트
      const ph = searchType === "director" ? "감독 이름으로 검색…" : "영화 제목으로 검색…";
      document.getElementById("homeInput").placeholder = ph;
      document.getElementById("topInput").placeholder  = ph;
    });
  });
}

/* ── 검색 결과 페이지 렌더 ──────────────────── */
function renderSearchPage() {
  const start      = (searchPage - 1) * PAGE_SIZE;
  const pageItems  = allSearchResults.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(allSearchResults.length / PAGE_SIZE);
  const grid       = document.getElementById("resGrid");

  grid.innerHTML = pageItems.map(m => cardHTML(m, false)).join("");
  bindCards(grid, pageItems, false);
  grid.scrollTop = 0;

  // 페이지네이션 UI
  const pg = document.getElementById("pagination");
  if (totalPages <= 1) { pg.innerHTML = ""; return; }

  const pages = [];
  // 항상 첫 페이지, 현재 ±2, 마지막 페이지 표시
  const show = new Set([1, totalPages,
    searchPage - 2, searchPage - 1, searchPage, searchPage + 1, searchPage + 2
  ].filter(p => p >= 1 && p <= totalPages));
  const sorted = [...show].sort((a, b) => a - b);

  let html = `<button class="pg-btn" id="pgPrev" ${searchPage === 1 ? "disabled" : ""}>←</button>`;
  let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) html += `<span class="pg-info">…</span>`;
    html += `<button class="pg-btn${p === searchPage ? " active" : ""}" data-page="${p}">${p}</button>`;
    prev = p;
  }
  html += `<button class="pg-btn" id="pgNext" ${searchPage === totalPages ? "disabled" : ""}>→</button>`;
  pg.innerHTML = html;

  pg.querySelectorAll("[data-page]").forEach(btn => {
    btn.addEventListener("click", () => { searchPage = parseInt(btn.dataset.page); renderSearchPage(); });
  });
  pg.querySelector("#pgPrev")?.addEventListener("click", () => { searchPage--; renderSearchPage(); });
  pg.querySelector("#pgNext")?.addEventListener("click", () => { searchPage++; renderSearchPage(); });
}

/* ── 영화 검색 ─────────────────────────────── */
async function doSearch(rawQ) {
  const q = rawQ.trim().replace(/\s+/g, " ");
  if (!q) return;
  activeCatId = null;
  renderSidebar();
  showScreen("results");

  document.getElementById("topInput").value = q;
  document.getElementById("resStat").textContent = "";
  document.getElementById("pagination").innerHTML = "";
  const grid = document.getElementById("resGrid");
  grid.innerHTML = `<div class="empty"><div class="spinner"></div>검색 중…</div>`;

  const param = searchType === "director"
    ? `director=${encodeURIComponent(q)}`
    : `q=${encodeURIComponent(q)}&searchBy=title`;

  try {
    const { results } = await apiGet(`/api/movies?${param}`);
    allSearchResults = results.slice().sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
    searchPage = 1;
    document.getElementById("resStat").textContent = `${results.length}편`;
    if (!results.length) {
      grid.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
      return;
    }
    renderSearchPage();
  } catch {
    grid.innerHTML = `<div class="empty">오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</div>`;
  }
}

/* ── 카테고리 뷰 ───────────────────────────── */
async function openCatView(id) {
  activeCatId = id;
  renderSidebar();
  showScreen("cat");

  const cat = categories.find(c => c.id === id);
  document.getElementById("catBarTitle").textContent = cat?.name || "";
  document.getElementById("catBarCount").textContent = "";

  const grid = document.getElementById("catGrid");
  document.getElementById("catPagination").innerHTML = "";
  grid.innerHTML = `<div class="empty"><div class="spinner"></div>불러오는 중…</div>`;

  try {
    const rows = await apiGet(`/api/categories?catId=${id}`);
    allCatMovies = rows.map(r => r.movie_data);
    allCatRows   = rows;
    catPage      = 1;

    document.getElementById("catBarCount").textContent = `${allCatMovies.length}편`;
    if (cat) cat.movie_count = allCatMovies.length;

    if (!allCatMovies.length) {
      grid.innerHTML = `<div class="empty">아직 추가된 영화가 없습니다.<br>영화를 검색해서 이 카테고리에 추가해 보세요.</div>`;
      return;
    }

    renderCatPage();
  } catch {
    grid.innerHTML = `<div class="empty">불러오기 실패</div>`;
  }
}

function renderCatPage() {
  const start      = (catPage - 1) * PAGE_SIZE;
  const pageItems  = allCatMovies.slice(start, start + PAGE_SIZE);
  const pageRows   = allCatRows.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(allCatMovies.length / PAGE_SIZE);
  const grid       = document.getElementById("catGrid");

  grid.innerHTML = pageItems.map((m, i) => cardHTML(m, true, pageRows[i].id)).join("");
  bindCards(grid, pageItems, true, pageRows, activeCatId);
  grid.scrollTop = 0;

  const pg = document.getElementById("catPagination");
  if (totalPages <= 1) { pg.innerHTML = ""; return; }

  const show = new Set([1, totalPages,
    catPage - 2, catPage - 1, catPage, catPage + 1, catPage + 2
  ].filter(p => p >= 1 && p <= totalPages));
  const sorted = [...show].sort((a, b) => a - b);

  let html = `<button class="pg-btn" id="cpPrev" ${catPage === 1 ? "disabled" : ""}>←</button>`;
  let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) html += `<span class="pg-info">…</span>`;
    html += `<button class="pg-btn${p === catPage ? " active" : ""}" data-cpage="${p}">${p}</button>`;
    prev = p;
  }
  html += `<button class="pg-btn" id="cpNext" ${catPage === totalPages ? "disabled" : ""}>→</button>`;
  pg.innerHTML = html;

  pg.querySelectorAll("[data-cpage]").forEach(btn => {
    btn.addEventListener("click", () => { catPage = parseInt(btn.dataset.cpage); renderCatPage(); });
  });
  pg.querySelector("#cpPrev")?.addEventListener("click", () => { catPage--; renderCatPage(); });
  pg.querySelector("#cpNext")?.addEventListener("click", () => { catPage++; renderCatPage(); });
}

/* ── 포스터 없을 때 제목 플레이스홀더 ──────── */
const NP_GRADIENTS = [
  ["#1a1a2e","#0f3460"], ["#1a2a1a","#0d3b1e"],
  ["#2a1a1a","#3b0d0d"], ["#1e1a2e","#2d1b4e"],
  ["#1a2626","#0d3333"], ["#26201a","#3d2e10"],
];
function posterPlaceholder(title) {
  const idx = (title || "").split("").reduce((a,c) => a + c.charCodeAt(0), 0) % NP_GRADIENTS.length;
  const [c1, c2] = NP_GRADIENTS[idx];
  const safe = (title || "제목 미상").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return `<div class="no-poster" style="background:linear-gradient(160deg,${c1} 0%,${c2} 100%)">` +
    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,1)" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>` +
    `<span class="np-title">${safe}</span>` +
    `</div>`;
}

/* ── 카드 HTML ─────────────────────────────── */
function cardHTML(m, inCat, rowId = "") {
  const thumbSrc = m.poster_url || (m.stills && m.stills[0]) || "";
  const titleAttr = (m.title || "").replace(/"/g, "&quot;");
  const img = thumbSrc
    ? `<img src="${thumbSrc}" alt="" loading="lazy" data-title="${titleAttr}" onerror="this.outerHTML=posterPlaceholder(this.dataset.title)">`
    : posterPlaceholder(m.title);
  const rm = inCat ? `<button class="card-rm" data-rowid="${rowId}">✕</button>` : "";
  return `
<div class="card" data-id="${m.id}">
  <div class="card-poster">
    ${img}${rm}
    <div class="card-body">
      <div class="card-title">${m.title || "제목 미상"}</div>
      <div class="card-meta">${m.director || "—"} · ${m.year || "—"}</div>
    </div>
  </div>
</div>`;
}

/* ── 카드 이벤트 ───────────────────────────── */
function bindCards(grid, movies, inCat, rows = [], catId = null) {
  grid.querySelectorAll(".card").forEach((el, i) => {
    el.addEventListener("click", e => {
      if (e.target.closest(".card-rm")) return;
      openModal(movies[i]);
    });

    const rm = el.querySelector(".card-rm");
    if (rm) {
      rm.addEventListener("click", async e => {
        e.stopPropagation();
        try {
          await apiDelete(`/api/categories?rowId=${rm.dataset.rowid}`);
          const cat = categories.find(c => c.id === catId);
          if (cat) cat.movie_count = Math.max(0, (cat.movie_count || 1) - 1);
          const idx = allCatRows.findIndex(r => String(r.id) === String(rm.dataset.rowid));
          if (idx !== -1) { allCatMovies.splice(idx, 1); allCatRows.splice(idx, 1); }
          document.getElementById("catBarCount").textContent = `${allCatMovies.length}편`;
          if (allCatMovies.length === 0) {
            document.getElementById("catGrid").innerHTML = `<div class="empty">아직 추가된 영화가 없습니다.<br>영화를 검색해서 이 카테고리에 추가해 보세요.</div>`;
            document.getElementById("catPagination").innerHTML = "";
          } else {
            if (catPage > Math.ceil(allCatMovies.length / PAGE_SIZE)) catPage = Math.max(1, catPage - 1);
            renderCatPage();
          }
          toast("카테고리에서 제거됨");
        } catch { toast("제거 실패", "err"); }
      });
    }
  });
}

/* ── 모달 ───────────────────────────────────── */
function openModal(m) {
  currentMovie = m;

  // 포스터 (없으면 스틸컷 첫 장으로 대체)
  const posterSrc = m.poster_url || (m.stills && m.stills[0]) || "";
  const mTitleAttr = (m.title || "").replace(/"/g, "&quot;");
  document.getElementById("mPoster").innerHTML = posterSrc
    ? `<img src="${posterSrc}" alt="" data-title="${mTitleAttr}" onerror="this.outerHTML=posterPlaceholder(this.dataset.title)">`
    : posterPlaceholder(m.title);

  // 제목
  document.getElementById("mTitle").textContent = m.title || "제목 미상";

  // 메타
  const actors = (m.actors || []).join(", ") || "—";
  const rows = [
    ["감독", m.director || "—"],
    ["배우", actors],
    ["제작연도", m.year || "—"],
    ["상영시간", m.runtime ? `${m.runtime}분` : "—"],
    ["장르", m.genre || "—"],
    ["상태", m.status || "—"],
  ];
  document.getElementById("mMeta").innerHTML = rows.map(([k, v]) =>
    `<span class="meta-k">${k}</span><span class="meta-v">${v}</span>`).join("");

  // 키워드 태그
  const kws = m.keywords || [];
  document.getElementById("mTags").innerHTML = kws.map(k => {
    const fest = FESTIVAL_WORDS.some(f => k.toLowerCase().includes(f.toLowerCase()));
    return `<span class="tag${fest ? " festival" : ""}">${k}</span>`;
  }).join("");

  // 줄거리
  const plotEl = document.getElementById("mPlot");
  if (m.plot) {
    plotEl.style.display = "";
    document.getElementById("mPlotText").textContent = m.plot;
  } else {
    plotEl.style.display = "none";
  }

  // 스틸컷
  const stills = m.stills || [];
  const stillEl = document.getElementById("mStills");
  if (stills.length) {
    stillEl.style.display = "";
    document.getElementById("mStillsRow").innerHTML =
      stills.map(s => `<img src="${s}" alt="" loading="lazy">`).join("");
  } else {
    stillEl.style.display = "none";
  }

  document.getElementById("mCatSel").value = "";
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  currentMovie = null;
}

/* ── 카테고리에 추가 ────────────────────────── */
document.getElementById("mAddBtn").addEventListener("click", async () => {
  const catId = document.getElementById("mCatSel").value;
  if (!catId || !currentMovie) return;

  const btn = document.getElementById("mAddBtn");
  btn.disabled = true;
  btn.textContent = "추가 중…";

  try {
    const data = await apiPost(`/api/categories?catId=${catId}`, {
      movie_id:   currentMovie.id,
      movie_data: currentMovie,
    });

    const cat = categories.find(c => c.id === catId);
    if (cat) cat.movie_count = (cat.movie_count || 0) + 1;
    renderSidebar();
    toast(`"${cat?.name}"에 추가됨`);
  } catch (e) {
    const msg = e.message === "409" ? "이미 추가된 영화입니다." : "추가 실패";
    toast(msg, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "추가";
  }
});

/* ── 새 카테고리 다이얼로그 ─────────────────── */
document.getElementById("btnNewCat").addEventListener("click", () => {
  document.getElementById("dlgInput").value = "";
  document.getElementById("dlgOverlay").classList.add("open");
  setTimeout(() => document.getElementById("dlgInput").focus(), 40);
});

document.getElementById("dlgCancel").addEventListener("click", () => {
  document.getElementById("dlgOverlay").classList.remove("open");
});

document.getElementById("dlgOk").addEventListener("click", async () => {
  const name = document.getElementById("dlgInput").value.trim();
  if (!name) return;
  try {
    const [cat] = await apiPost("/api/categories", { name });
    categories.push({ ...cat, movie_count: 0 });
    renderSidebar();
    document.getElementById("dlgOverlay").classList.remove("open");
    toast(`"${name}" 생성됨`);
  } catch (e) { toast(`생성 실패: ${e.message}`, "err"); }
});

document.getElementById("dlgInput").addEventListener("keydown", e => {
  if (e.key === "Enter")  document.getElementById("dlgOk").click();
  if (e.key === "Escape") document.getElementById("dlgCancel").click();
});

/* ── 검색 이벤트 ────────────────────────────── */
function bindSearch(inputId, btnId) {
  const run = () => doSearch(document.getElementById(inputId).value.trim());
  document.getElementById(btnId).addEventListener("click", run);
  document.getElementById(inputId).addEventListener("keydown", e => { if (e.key === "Enter") run(); });
}
bindSearch("homeInput", "homeBtn");
bindSearch("topInput",  "topBtn");
initSearchTypeToggle("homeSearchType", "homeInput");
initSearchTypeToggle("topSearchType",  "topInput");

/* ── 뒤로가기 ──────────────────────────────── */
document.getElementById("backBtn").addEventListener("click", () => {
  activeCatId = null; renderSidebar(); showScreen("home");
});
document.getElementById("catBackBtn").addEventListener("click", () => {
  activeCatId = null; renderSidebar(); showScreen("home");
});

/* ── 모달 닫기 ─────────────────────────────── */
document.getElementById("modalX").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("overlay")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("overlay").classList.contains("open")) closeModal();
  else if (document.getElementById("dlgOverlay").classList.contains("open")) {
    document.getElementById("dlgOverlay").classList.remove("open");
  }
});

/* ── 초기화 ────────────────────────────────── */
showScreen("home");
loadCategories();
</script>
</body>
</html>
