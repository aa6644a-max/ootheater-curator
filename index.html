<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오오극장 — 독립영화 기획전 큐레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:       #0f0f0f;
  --surface:  #181818;
  --surface2: #222;
  --border:   #2c2c2c;
  --text:     #e4e4e4;
  --muted:    #5a5a5a;
  --accent:   #c8a96e;
  --accent2:  #5b8dd9;
  --danger:   #c0392b;
  --font:     "Noto Serif KR", serif;
  --mono:     "DM Mono", monospace;
  --sidebar:  220px;
  --ease:     0.15s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
.sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-head {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sb-logo { font-size: 0.95rem; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
.sb-sub  { font-size: 0.62rem; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

.sb-label {
  padding: 14px 16px 6px;
  font-size: 0.58rem;
  font-family: var(--mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0;
}
.sb-list::-webkit-scrollbar { width: 3px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--text);
  transition: background var(--ease);
  position: relative;
  user-select: none;
}
.cat-item:hover { background: var(--surface2); }
.cat-item.active {
  background: var(--surface2);
  color: var(--accent);
}
.cat-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
}
.cat-chevron { font-size: 0.55rem; opacity: 0.4; }
.cat-name    { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-count   { font-size: 0.62rem; color: var(--muted); font-family: var(--mono); flex-shrink: 0; }
.cat-del {
  opacity: 0;
  color: var(--danger);
  font-size: 0.65rem;
  cursor: pointer;
  padding: 2px 4px;
  transition: opacity var(--ease);
  flex-shrink: 0;
}
.cat-item:hover .cat-del { opacity: 0.7; }
.cat-item:hover .cat-del:hover { opacity: 1; }

.sb-foot {
  border-top: 1px solid var(--border);
  padding: 12px;
}
.btn-new-cat {
  width: 100%;
  background: none;
  border: 1px dashed var(--border);
  color: var(--muted);
  padding: 8px;
  font-size: 0.72rem;
  cursor: pointer;
  border-radius: 3px;
  font-family: var(--font);
  transition: all var(--ease);
}
.btn-new-cat:hover { border-color: var(--accent); color: var(--accent); }

/* ═══════════════════════════════════════
   MAIN
═══════════════════════════════════════ */
.main {
  flex: 1;
  min-width: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── 검색 홈 화면 ── */
#homeScreen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
}
.home-title {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.home-sub {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 36px;
  font-family: var(--mono);
}
.home-search-row {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 580px;
  align-items: stretch;
}
.home-filter-wrap {
  width: 100%;
  max-width: 580px;
  margin-top: 8px;
}
.home-filter-wrap .adv-toggle {
  width: 100%;
  text-align: left;
  border-radius: 3px 3px 0 0;
}
.home-filter-wrap .adv-toggle:not(.open) {
  border-radius: 3px;
}
.home-adv-panel.open {
  border: 1px solid var(--accent);
  border-top: none;
  border-radius: 0 0 3px 3px;
  padding: 14px 16px;
}
.home-search-input {
  flex: 1;
  max-width: none !important;
}
.search-wrap {
  display: flex;
  width: 100%;
  max-width: 580px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  transition: border-color var(--ease);
}
.search-wrap:focus-within { border-color: var(--accent); }
.search-wrap input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 14px 18px;
  font-size: 1rem;
  color: var(--text);
  font-family: var(--font);
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap button {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 0 22px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  border-radius: 0 2px 2px 0;
  font-family: var(--font);
  transition: opacity var(--ease);
  letter-spacing: 0.02em;
}
.search-wrap button:hover { opacity: 0.85; }

.search-type {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.search-type button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 0 12px;
  font-size: 0.72rem;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
  white-space: nowrap;
  height: 100%;
}
.search-type button.active {
  background: var(--surface2);
  color: var(--accent);
}
.search-type button:hover:not(.active) { color: var(--text); }

/* ── 결과 화면 ── */
#resultsScreen {
  display: none;
  flex-direction: column;
  height: 100%;
}
.results-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.btn-back {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 12px;
  font-size: 0.72rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: all var(--ease);
  white-space: nowrap;
}
.btn-back:hover { color: var(--text); border-color: var(--text); }
.results-search {
  display: flex;
  flex: 1;
  max-width: 460px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
}
.results-search:focus-within { border-color: var(--accent); }
.results-search input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 7px 14px;
  font-size: 0.88rem;
  color: var(--text);
  font-family: var(--font);
}
.results-search input::placeholder { color: var(--muted); }
.results-search button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 0 12px;
  cursor: pointer;
  font-size: 0.7rem;
  font-family: var(--mono);
  transition: color var(--ease);
}
.results-search button:hover { color: var(--text); }
.results-stat {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  white-space: nowrap;
  margin-left: auto;
}

/* ── 고급 검색 패널 ── */
.adv-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 10px;
  font-size: 0.7rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  white-space: nowrap;
  transition: all var(--ease);
  flex-shrink: 0;
}
.adv-toggle:hover, .adv-toggle.open { color: var(--accent); border-color: var(--accent); }
.adv-panel {
  display: none;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.adv-panel.open { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.adv-field {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.adv-label {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  white-space: nowrap;
  min-width: 42px;
}
.adv-field input[type="number"] {
  width: 68px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 0.78rem;
  font-family: var(--mono);
  outline: none;
}
.adv-field input[type="number"]:focus { border-color: var(--accent); }
.adv-field select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 0.78rem;
  font-family: var(--font);
  outline: none;
  cursor: pointer;
}
.adv-field select:focus { border-color: var(--accent); }
.adv-radios {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.adv-radios label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.74rem;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
.adv-radios input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
.adv-reset {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  font-size: 0.68rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
  align-self: center;
}
.adv-reset:hover { color: var(--danger); border-color: var(--danger); }

/* 장르 칩 */
.adv-field--genre { align-items: flex-start; }
.genre-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.genre-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 10px;
  font-size: 0.68rem;
  border-radius: 20px;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
  white-space: nowrap;
  line-height: 1.6;
}
.genre-chip:hover { border-color: var(--accent); color: var(--text); }
.genre-chip.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }

/* 배우 텍스트 입력 */
.adv-field input[type="text"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  padding: 4px 10px;
  font-size: 0.78rem;
  font-family: var(--font);
  outline: none;
  width: 140px;
  transition: border-color var(--ease);
}
.adv-field input[type="text"]:focus { border-color: var(--accent); }

/* 토글 체크박스 행 */
.adv-checks {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  align-self: center;
}
.adv-check-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.74rem;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.adv-check-label input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.adv-active-count {
  display: inline-block;
  background: var(--accent);
  color: #111;
  font-size: 0.6rem;
  font-weight: 700;
  border-radius: 8px;
  padding: 1px 5px;
  margin-left: 3px;
  vertical-align: middle;
}

.movie-grid {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  align-content: start;
  align-items: start;
}
.mobile-bottom-nav { display: none; }
.mobile-cat-sheet  { display: none; }
.mobile-scrim      { display: none; }
.movie-grid::-webkit-scrollbar { width: 4px; }
.movie-grid::-webkit-scrollbar-thumb { background: var(--border); }

/* ── 리스트 뷰 ── */
.movie-grid.list-view {
  grid-template-columns: 1fr;
  grid-auto-rows: 72px;
  gap: 4px;
  padding: 10px 20px 20px;
}
.movie-grid.list-view .card {
  flex-direction: row;
  height: 72px;
  overflow: hidden;
}
.movie-grid.list-view .card-poster {
  width: 48px;
  min-width: 48px;
  height: 72px;
  flex-shrink: 0;
}
.movie-grid.list-view .card-info {
  justify-content: center;
  padding: 0 14px;
  background: none;
  flex: 1;
  min-width: 0;
}
.movie-grid.list-view .card-title { font-size: 0.86rem; }
.movie-grid.list-view .card-meta  { font-size: 0.72rem; }

/* ── 뷰 토글 버튼 ── */
.view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.vt-btn {
  background: none;
  border: none;
  color: var(--muted);
  padding: 6px 9px;
  cursor: pointer;
  transition: all var(--ease);
  display: flex;
  align-items: center;
}
.vt-btn + .vt-btn { border-left: 1px solid var(--border); }
.vt-btn:hover { color: var(--text); }
.vt-btn.active { background: var(--surface2); color: var(--accent); }

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.pagination:empty { display: none; }
.pg-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  font-size: 0.72rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  transition: all var(--ease);
}
.pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pg-btn:disabled { opacity: 0.3; cursor: default; }
.pg-btn.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
.pg-info {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  padding: 0 6px;
}

/* ── 카테고리 뷰 ── */
#catScreen {
  display: none;
  flex-direction: column;
  height: 100%;
}
.cat-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.cat-bar-title { font-size: 0.95rem; font-weight: 600; flex: 1; }
.cat-bar-count { font-size: 0.68rem; color: var(--muted); font-family: var(--mono); }

/* ═══════════════════════════════════════
   MOVIE CARD — 포스터 + 하단 텍스트 구조
═══════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--ease);
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--accent); }

.card-poster {
  width: 100%;
  height: 200px;        /* 고정 높이 — 이미지 비율과 무관하게 항상 동일 */
  background: var(--surface2);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-poster img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;  /* 박스 안에 이미지 전체 표시, 회색 여백 허용 */
  display: block;
}
.card-poster .no-poster {
  position: absolute;
  inset: 0;
}
.no-poster {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  padding: 12px;
  box-sizing: border-box;
}
.no-poster .np-title {
  color: rgba(255,255,255,0.85);
  font-size: 0.78rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.4;
  word-break: keep-all;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.no-poster svg { flex-shrink: 0; opacity: 0.35; }

.card-rm {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(0,0,0,0.75);
  border: none;
  color: var(--danger);
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.7rem;
  display: none;
  align-items: center;
  justify-content: center;
  transition: opacity var(--ease);
}
#catScreen .card:hover .card-rm { display: flex; }

/* 포스터 아래 텍스트 영역 */
.card-info {
  padding: 8px 10px 9px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
  background: var(--surface);
}
.card-body { display: none; }   /* 구 그라디언트 오버레이 — 미사용 */
.card-title {
  font-size: 0.76rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.card-meta {
  font-size: 0.62rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--mono);
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
  overflow-y: auto;
}
.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 100%;
  max-width: 800px;
  position: relative;
  animation: fadeUp 0.15s ease;
  margin: auto;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-x {
  position: absolute;
  top: 12px; right: 14px;
  background: none; border: none;
  color: var(--muted); font-size: 1rem;
  cursor: pointer; z-index: 1;
  transition: color var(--ease);
}
.modal-x:hover { color: var(--text); }

.modal-hero {
  display: flex;
  gap: 24px;
  padding: 24px;
}
.modal-poster {
  width: 150px;
  min-width: 150px;
  aspect-ratio: 2/3;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-poster-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 0.65rem; font-family: var(--mono);
}

.modal-info { flex: 1; min-width: 0; }
.modal-title {
  font-size: 1.45rem;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 14px;
}

.meta-table {
  display: grid;
  grid-template-columns: 68px 1fr;
  gap: 6px 10px;
  font-size: 0.76rem;
  margin-bottom: 14px;
}
.meta-k { color: var(--muted); }
.meta-v { color: var(--text); }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 16px;
}
.tag {
  padding: 2px 8px;
  font-size: 0.62rem;
  border-radius: 2px;
  font-family: var(--mono);
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--surface2);
}
.tag.festival { border-color: var(--accent2); color: var(--accent2); }

.add-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.cat-sel {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.78rem;
  border-radius: 3px;
  font-family: var(--font);
  outline: none;
  cursor: pointer;
}
.cat-sel:focus { border-color: var(--accent); }
.btn-add {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 8px 18px;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: opacity var(--ease);
  white-space: nowrap;
}
.btn-add:hover { opacity: 0.85; }
.btn-add:disabled { opacity: 0.35; cursor: default; }

.modal-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

.modal-section { padding: 16px 24px; }
.section-label {
  font-size: 0.6rem;
  font-family: var(--mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.plot-text {
  font-size: 0.82rem;
  line-height: 1.85;
  color: #b8b8b8;
}

.stills-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.stills-scroll::-webkit-scrollbar { height: 3px; }
.stills-scroll::-webkit-scrollbar-thumb { background: var(--border); }
.stills-scroll img {
  height: 120px;
  border-radius: 3px;
  object-fit: cover;
  flex-shrink: 0;
  cursor: zoom-in;
  transition: opacity var(--ease);
}
.stills-scroll img:hover { opacity: 0.85; }

/* ═══════════════════════════════════════
   LIGHTBOX (스틸컷 크게 보기)
═══════════════════════════════════════ */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,0.92);
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 0 60px rgba(0,0,0,0.8);
  cursor: default;
}
#lightboxClose {
  position: absolute;
  top: 20px; right: 24px;
  background: none; border: none;
  color: #fff; font-size: 1.8rem;
  cursor: pointer; opacity: 0.7;
  line-height: 1;
}
#lightboxClose:hover { opacity: 1; }

/* 감독 링크 */
.director-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--ease);
}
.director-link:hover { border-color: var(--accent); }

/* ═══════════════════════════════════════
   DIALOG (새 카테고리)
═══════════════════════════════════════ */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.dialog-overlay.open { display: flex; }

.dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 24px;
  width: 360px;
}
.dialog h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 14px; }
.dialog input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  font-size: 0.85rem;
  border-radius: 3px;
  font-family: var(--font);
  outline: none;
  margin-bottom: 14px;
}
.dialog input:focus { border-color: var(--accent); }
.dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 7px 14px;
  font-size: 0.76rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: all var(--ease);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text); }

.btn-primary {
  background: var(--accent);
  border: none;
  color: #111;
  padding: 7px 16px;
  font-size: 0.76rem;
  font-weight: 700;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font);
  transition: opacity var(--ease);
}
.btn-primary:hover { opacity: 0.85; }

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  font-size: 0.76rem;
  border-radius: 3px;
  z-index: 9999;
  display: none;
  font-family: var(--mono);
  pointer-events: none;
}
.toast.show { display: block; animation: fadeUp 0.15s ease; }
.toast.ok   { border-color: var(--accent); }
.toast.err  { border-color: var(--danger); }

/* ═══════════════════════════════════════
   공용
═══════════════════════════════════════ */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 0.82rem;
  font-family: var(--mono);
  line-height: 1.8;
}

/* ═══════════════════════════════════════
   DETAIL PAGE
═══════════════════════════════════════ */
#detailScreen {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#detailScreen::-webkit-scrollbar { width: 4px; }
#detailScreen::-webkit-scrollbar-thumb { background: var(--border); }

.detail-back-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.detail-back-title {
  font-size: 0.82rem;
  color: var(--muted);
  font-family: var(--mono);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail-content {
  padding: 28px 28px 40px;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}

.detail-hero {
  display: flex;
  gap: 28px;
  margin-bottom: 28px;
}
.detail-poster {
  width: 190px;
  min-width: 190px;
  aspect-ratio: 2/3;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
  flex-shrink: 0;
}
.detail-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

.detail-info { flex: 1; min-width: 0; }
.detail-title-ko {
  font-size: 1.75rem;
  font-weight: 900;
  line-height: 1.25;
  margin-bottom: 5px;
}
.detail-title-en {
  font-size: 0.82rem;
  color: var(--muted);
  font-family: var(--mono);
  margin-bottom: 10px;
}
.detail-rating-badge {
  display: inline-block;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 2px 8px;
  font-size: 0.62rem;
  font-family: var(--mono);
  border-radius: 2px;
  margin-bottom: 14px;
}
.detail-add-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 18px;
}

.detail-section {
  padding-top: 20px;
  margin-top: 20px;
  border-top: 1px solid var(--border);
}

.detail-awards {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 10px;
}
.award-item {
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 0.78rem;
  line-height: 1.6;
}
.award-festival {
  color: var(--accent2);
  font-family: var(--mono);
  font-size: 0.66rem;
  margin-bottom: 1px;
}
.award-name { font-weight: 600; color: var(--text); }
.award-person { color: var(--muted); font-family: var(--mono); font-size: 0.7rem; }

.detail-staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.staff-item { font-size: 0.76rem; }
.staff-role { color: var(--muted); font-family: var(--mono); font-size: 0.62rem; display: block; }
.staff-name { color: var(--text); }

.detail-companies {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 8px;
  font-family: var(--mono);
}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */

/* ── 태블릿 (641–1023px) ── */
@media (min-width: 641px) and (max-width: 1023px) {
  .movie-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ── 모바일 (≤640px) ── */
@media (max-width: 640px) {
  .desktop-sidebar { display: none !important; }

  /* 뷰 토글 숨김 — 모바일은 리스트 뷰 고정 */
  .view-toggle { display: none !important; }

  .movie-grid {
    grid-template-columns: 1fr;
    grid-auto-rows: 72px;

    padding: 8px 12px 80px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .movie-grid .card {
    flex-direction: row;
    height: 72px;
    overflow: hidden;
  }
  .movie-grid .card-poster {

    min-width: 48px;
    height: 72px;
    flex-shrink: 0;
  }
  .movie-grid .card-info {
    justify-content: center;
    padding: 0 14px;
    background: none;
    flex: 1;
    min-width: 0;
  }
  .movie-grid .card-title { font-size: 0.86rem; }
  .movie-grid .card-meta  { font-size: 0.72rem; }

  .main {
    height: 100svh;
    overflow: hidden;
  }

  #homeScreen {
    padding: 40px 20px 80px;
  }

  /* 홈 검색 영역: 세로 배치 */
  .home-search-row {
    flex-direction: column;
    max-width: 100%;
    gap: 10px;
  }
  .home-filter-wrap {
    max-width: 100%;
  }
  .home-adv-panel.open {
    padding: 12px;
  }
  #homeSearchType {
    width: 100%;
    border-radius: 3px;
  }
  #homeSearchType button {
    flex: 1;
    height: 44px;
    font-size: 0.8rem;
  }
  .home-search-input {
    width: 100%;
  }
  .home-search-input input {
    font-size: 1rem;
    padding: 14px 16px;
  }

  .results-bar {
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
  }
  .results-stat { margin-left: 0; }

  .adv-panel.open { flex-direction: column; gap: 10px; }

  .pagination { padding: 10px 12px 80px; }

  /* 모달 풀스크린 */
  .overlay { padding: 0; }
  .modal {
    max-width: 100%;
    min-height: 100vh;
    border-radius: 0;
    margin: 0;
  }
  .modal-hero { flex-direction: column; padding: 16px; gap: 14px; }
  .modal-poster { width: 110px; min-width: 110px; }

  /* 디테일 페이지 모바일 */
  .detail-content { padding: 16px 16px 80px; }
  .detail-hero { flex-direction: column; gap: 14px; }
  .detail-poster { width: 110px; min-width: 110px; }
  .detail-title-ko { font-size: 1.3rem; }
  .detail-staff-grid { grid-template-columns: repeat(2, 1fr); }

  /* 토스트: 하단 탭바 위 */
  .toast { bottom: 70px; right: 12px; left: 12px; text-align: center; }

  /* 하단 탭바 */
  .mobile-bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 120;
    align-items: stretch;
  }
  .mobile-bottom-nav .mnav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 0.58rem;
    font-family: var(--mono);
    cursor: pointer;
    transition: color var(--ease);
    padding: 0;
    letter-spacing: 0.04em;
  }
  .mobile-bottom-nav .mnav-btn:hover,
  .mobile-bottom-nav .mnav-btn.active { color: var(--accent); }
  .mobile-bottom-nav .mnav-btn svg { width: 20px; height: 20px; }

  /* 카테고리 바텀 시트 */
  .mobile-cat-sheet {
    position: fixed;
    bottom: 60px; left: 0; right: 0;

    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    z-index: 110;
    transform: translateY(100%);
    transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  .mobile-cat-sheet.open { transform: translateY(0); }

  .mobile-cat-sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .mobile-cat-sheet-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
  }
  .mobile-cat-sheet-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .mobile-cat-list { flex: 1; overflow-y: auto; }
  .mobile-cat-list::-webkit-scrollbar { width: 3px; }

  .mobile-cat-sheet-foot {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* 시트 열릴 때 뒤 scrim */
  .mobile-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 105;
  }
  .mobile-scrim.open { display: block; }
}

/* ── 데스크톱 (≥1024px) ── */
@media (min-width: 1024px) {
  .mobile-bottom-nav { display: none; }
  .desktop-sidebar { display: flex; }
  .movie-grid { grid-template-columns: repeat(4, 1fr); }
}

</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<nav class="sidebar desktop-sidebar">
  <div class="sb-head">
    <div class="sb-logo">오오극장</div>
    <div class="sb-sub">독립영화 기획전 큐레이터</div>
  </div>
  <div class="sb-label">내 카테고리</div>
  <div class="sb-list" id="catList"></div>
  <div class="sb-foot">
    <button class="btn-new-cat" id="btnNewCat">+ 새 카테고리</button>
  </div>
</nav>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main">

  <!-- 홈 검색 화면 -->
  <div id="homeScreen">
    <div class="home-title">오오극장 큐레이터</div>
    <div class="home-sub">영화를 검색하거나, 연도 필터만 설정 후 검색하면 전체 목록을 볼 수 있습니다</div>
    <div class="home-search-row">
      <div class="search-type" id="homeSearchType">
        <button class="active" data-type="title">제목</button>
        <button data-type="director">감독</button>
        <button data-type="actor">배우</button>
      </div>
      <div class="search-wrap home-search-input">
        <input id="homeInput" type="text" placeholder="영화 제목으로 검색…" autocomplete="off" />
        <button id="homeBtn">검색</button>
      </div>
    </div>

    <!-- 홈 필터 패널 -->
    <div class="home-filter-wrap">
      <button class="adv-toggle" id="homeAdvToggle">필터 ▾</button>
      <div class="adv-panel home-adv-panel" id="homeAdvPanel">

        <div class="adv-field">
          <span class="adv-label">연도</span>
          <input type="number" id="hfYearFrom" placeholder="시작" min="2000" max="2030">
          <span style="color:var(--muted);font-size:0.8rem">~</span>
          <input type="number" id="hfYearTo" placeholder="종료" min="2000" max="2030">
        </div>
        <div class="adv-field adv-field--genre">
          <span class="adv-label">장르</span>
          <div class="genre-chips" id="hfGenreChips">
            <button class="genre-chip" data-genre="드라마">드라마</button>
            <button class="genre-chip" data-genre="다큐멘터리">다큐</button>
            <button class="genre-chip" data-genre="애니메이션">애니</button>
            <button class="genre-chip" data-genre="코미디">코미디</button>
            <button class="genre-chip" data-genre="스릴러">스릴러</button>
            <button class="genre-chip" data-genre="공포">공포</button>
            <button class="genre-chip" data-genre="멜로/로맨스">멜로</button>
            <button class="genre-chip" data-genre="음악">음악</button>
            <button class="genre-chip" data-genre="SF">SF</button>
            <button class="genre-chip" data-genre="가족">가족</button>
            <button class="genre-chip" data-genre="액션">액션</button>
          </div>
        </div>

        <div class="adv-field">
          <span class="adv-label">러닝타임</span>
          <div class="adv-radios">
            <label><input type="radio" name="hfRuntime" value="" checked> 전체</label>
            <label><input type="radio" name="hfRuntime" value="short"> 단편 &lt;40분</label>
            <label><input type="radio" name="hfRuntime" value="feature"> 장편 ≥40분</label>
          </div>
        </div>
        <div class="adv-field">
          <span class="adv-label">개봉상태</span>
          <div class="adv-radios">
            <label><input type="radio" name="hfStatus" value="" checked> 전체</label>
            <label><input type="radio" name="hfStatus" value="미개봉"> 미개봉</label>
            <label><input type="radio" name="hfStatus" value="제작완료"> 제작완료</label>
            <label><input type="radio" name="hfStatus" value="개봉준비"> 개봉준비</label>
          </div>
        </div>

        <div class="adv-field">
          <span class="adv-label">출연배우</span>
          <input type="text" id="hfActor" placeholder="배우 이름…" autocomplete="off">
        </div>
        <div class="adv-checks">
          <label class="adv-check-label"><input type="checkbox" id="hfIndieOnly"> 독립영화만</label>
          <label class="adv-check-label"><input type="checkbox" id="hfHasPoster"> 포스터 있음</label>
        </div>

        <button class="adv-reset" id="homeAdvReset">초기화</button>
      </div>
    </div>
  </div>

  <!-- 검색 결과 화면 -->
  <div id="resultsScreen">
    <div class="results-bar">
      <button class="btn-back" id="backBtn">← 홈</button>
      <div class="search-type" id="topSearchType">
        <button class="active" data-type="title">제목</button>
        <button data-type="director">감독</button>
        <button data-type="actor">배우</button>
      </div>
      <div class="results-search">
        <input id="topInput" type="text" placeholder="다시 검색…" autocomplete="off" />
        <button id="topBtn">검색</button>
      </div>
      <button class="adv-toggle" id="advToggle">필터 ▾</button>
      <div class="view-toggle" id="viewToggle">
        <button class="vt-btn active" data-view="grid" title="그리드">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="6" height="6"/><rect x="8" y="0" width="6" height="6"/><rect x="0" y="8" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/></svg>
        </button>
        <button class="vt-btn" data-view="list" title="리스트">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="1" width="14" height="2"/><rect x="0" y="6" width="14" height="2"/><rect x="0" y="11" width="14" height="2"/></svg>
        </button>
      </div>
      <div class="results-stat" id="resStat"></div>
    </div>
    <div class="adv-panel" id="advPanel">

      <!-- 행 1: 연도 + 장르 칩 -->
      <div class="adv-field">
        <span class="adv-label">연도</span>

<!-- ═══════════ TOAST ═══════════ -->

<script>
/* ── 전역 상태 ─────────────────────────────── */
let categories       = [];
let activeCatId      = null;
let currentMovie     = null;
let searchType       = "title"; // "title" | "director" | "actor"
let allSearchResults = [];
let filteredResults  = [];
let searchPage       = 1;
let filterYearFrom   = "";
let filterYearTo     = "";
let filterGenre      = "";
let filterRuntime    = ""; // "" | "short" | "feature"
let filterStatus     = "";
let filterActor      = "";
let filterIndieOnly  = false;
let filterHasPoster  = false;
let allCatMovies     = [];
let allCatRows       = [];
let catPage          = 1;
const PAGE_SIZE      = 12;
let browseMode       = false; // 연도 브라우징 모드 여부
let browseTotalCount = 0;     // 서버 전체 건수
let browsePageNum    = 1;     // 현재 서버 페이지
let viewMode         = "grid"; // "grid" | "list"
let detailFromScreen = "results"; // 상세 페이지 진입 전 화면

/* ── 유틸 ──────────────────────────────────── */
let toastTimer;
function toast(msg, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

function showScreen(name) {
  document.getElementById("homeScreen").style.display    = name === "home"    ? "" : "none";
  document.getElementById("resultsScreen").style.display = name === "results" ? "flex" : "none";
  document.getElementById("catScreen").style.display     = name === "cat"     ? "flex" : "none";
  document.getElementById("detailScreen").style.display  = name === "detail"  ? "flex" : "none";
  const homeBtn = document.getElementById("mnavHome");
  const catBtn  = document.getElementById("mnavCat");
  if (homeBtn) homeBtn.classList.toggle("active", name === "home" || name === "results" || name === "detail");
  if (catBtn)  catBtn.classList.toggle("active", name === "cat");
}

const FESTIVAL_WORDS = ["전주", "부산", "서울", "부천", "제주", "인디", "독립", "다큐", "iff", "독립영화"];

/* ── 카테고리 API ───────────────────────────── */
async function apiGet(url)          { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function apiPost(url, body)   { const r = await fetch(url, { method:"POST",  headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); if (!r.ok) { let msg = r.status; try { const d = await r.json(); msg = d.error || d.message || d.hint || JSON.stringify(d); } catch {} throw new Error(msg); } return r.json(); }
async function apiDelete(url)       { const r = await fetch(url, { method:"DELETE" }); if (!r.ok) throw new Error(r.status); }

async function loadCategories() {
  try {
    categories = await apiGet("/api/categories");
    renderSidebar();
  } catch { /* 무시 */ }
}

/* ── 사이드바 ───────────────────────────────── */
function renderSidebar() {
  const list = document.getElementById("catList");
  if (!categories.length) {
    list.innerHTML = `<div style="padding:16px;font-size:0.72rem;color:var(--muted);font-family:var(--mono)">카테고리 없음</div>`;
    updateCatSel();
    return;
  }
  list.innerHTML = categories.map(c => `
    <div class="cat-item${activeCatId === c.id ? " active" : ""}" data-id="${c.id}">
      <span class="cat-chevron">▶</span>
      <span class="cat-name">${c.name}</span>
      <span class="cat-count">${c.movie_count || 0}</span>
      <span class="cat-del" data-del="${c.id}">✕</span>
    </div>`).join("");

  list.querySelectorAll(".cat-item").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.dataset.del) return;
      openCatView(el.dataset.id);
    });
  });

  list.querySelectorAll(".cat-del").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const id   = btn.dataset.del;
      const cat  = categories.find(c => c.id === id);
      if (!confirm(`"${cat?.name}" 카테고리를 삭제하시겠습니까?`)) return;
      try {
        await apiDelete(`/api/categories?id=${id}`);
        categories = categories.filter(c => c.id !== id);
        if (activeCatId === id) { activeCatId = null; showScreen("home"); }
        renderSidebar();
        toast("카테고리 삭제됨");
      } catch { toast("삭제 실패", "err"); }
    });
  });

  updateCatSel();
  renderMobileCatList();
}

function renderMobileCatList() {
  const list = document.getElementById("mobileCatList");
  if (!list) return;
  if (!categories.length) {
    list.innerHTML = `<div style="padding:16px;font-size:0.72rem;color:var(--muted);font-family:var(--mono)">카테고리 없음</div>`;
    return;
  }
  list.innerHTML = categories.map(c => `
    <div class="cat-item${activeCatId === c.id ? " active" : ""}" data-id="${c.id}">
      <span class="cat-chevron">▶</span>
      <span class="cat-name">${c.name}</span>
      <span class="cat-count">${c.movie_count || 0}</span>
    </div>`).join("");
  list.querySelectorAll(".cat-item").forEach(el => {
    el.addEventListener("click", () => {
      closeMobileCatSheet();
      openCatView(el.dataset.id);
    });
  });
}

function openMobileCatSheet() {
  document.getElementById("mobileCatSheet").classList.add("open");
  document.getElementById("mobileScrim").classList.add("open");
}

function closeMobileCatSheet() {
  document.getElementById("mobileCatSheet").classList.remove("open");
  document.getElementById("mobileScrim").classList.remove("open");
}

function updateCatSel() {
  const opts = `<option value="">카테고리 선택…</option>` +
    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  document.getElementById("mCatSel").innerHTML = opts;
  const detailSel = document.getElementById("detailCatSel");
  if (detailSel) detailSel.innerHTML = opts;
}

/* ── 필터 적용 ──────────────────────────────── */
function applyFilters(results) {
  return results.filter(m => {
    const yr = parseInt(m.year) || 0;
    if (filterYearFrom && yr < parseInt(filterYearFrom)) return false;
    if (filterYearTo   && yr > parseInt(filterYearTo))   return false;
    if (filterGenre    && !(m.genre || "").includes(filterGenre)) return false;
    if (filterRuntime === "short"   && !(m.runtime != null && m.runtime < 40))  return false;
    if (filterRuntime === "feature" && !(m.runtime != null && m.runtime >= 40)) return false;
    if (filterStatus   && !(m.status || "").includes(filterStatus)) return false;
    if (filterActor) {
      const q = filterActor.toLowerCase();
      const hit = (m.actors || []).some(a => a.toLowerCase().includes(q));
      if (!hit) return false;
    }
    if (filterIndieOnly && !(m.type || "").includes("독립")) return false;
    if (filterHasPoster && !m.poster_url) return false;
    return true;
  });
}

function activeFilterCount() {
  let n = [filterYearFrom, filterYearTo, filterGenre, filterRuntime, filterStatus, filterActor].filter(Boolean).length;
  if (filterIndieOnly) n++;
  if (filterHasPoster) n++;
  return n;
}

function updateAdvToggleLabel() {
  const cnt   = activeFilterCount();
  const label = cnt ? `필터 ▾ <span class="adv-active-count">${cnt}</span>` : "필터 ▾";
  ["advToggle", "homeAdvToggle"].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.innerHTML = label;
  });
}

/* ── 검색 타입 토글 ─────────────────────────── */
const PH = {
  title:    "영화 제목으로 검색…",
  director: "감독 이름으로 검색…",
  actor:    "배우 이름으로 검색…",
};
function initSearchTypeToggle(groupId, inputId) {
  const group = document.getElementById(groupId);
  group.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      searchType = btn.dataset.type;
      ["homeSearchType", "topSearchType"].forEach(id => {
        document.getElementById(id)?.querySelectorAll("button").forEach(b => {
          b.classList.toggle("active", b.dataset.type === searchType);
        });
      });
      document.getElementById("homeInput").placeholder = PH[searchType] || PH.title;
      document.getElementById("topInput").placeholder  = PH[searchType] || PH.title;
    });
  });
}

/* ── 고급 패널 초기화 ────────────────────────── */
function initAdvPanel() {
  const toggle = document.getElementById("advToggle");
  const panel  = document.getElementById("advPanel");

  toggle.addEventListener("click", () => {
    const open = panel.classList.toggle("open");
    toggle.classList.toggle("open", open);
  });

  const reApply = () => {
    filterYearFrom  = document.getElementById("fYearFrom").value.trim();
    filterYearTo    = document.getElementById("fYearTo").value.trim();
    filterRuntime   = document.querySelector('input[name="fRuntime"]:checked')?.value || "";
    filterStatus    = document.querySelector('input[name="fStatus"]:checked')?.value  || "";
    filterActor     = document.getElementById("fActor").value.trim();
    filterIndieOnly = document.getElementById("fIndieOnly").checked;
    filterHasPoster = document.getElementById("fHasPoster").checked;
    filteredResults = applyFilters(allSearchResults);
    searchPage = 1;
    updateAdvToggleLabel();
    renderSearchPage();
    document.getElementById("resStat").textContent =
      filteredResults.length !== allSearchResults.length
        ? `${filteredResults.length} / ${allSearchResults.length}편`
        : `${allSearchResults.length}편`;
  };

  /* 장르 칩 — 단일 선택 토글 */
  document.getElementById("genreChips").addEventListener("click", e => {
    const chip = e.target.closest(".genre-chip");
    if (!chip) return;
    const genre = chip.dataset.genre;
    if (filterGenre === genre) {
      filterGenre = "";
      chip.classList.remove("active");
    } else {
      document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      filterGenre = genre;
    }
    reApply();
  });

  /* 배우 입력 — 디바운스 300ms */
  let actorTimer;
  document.getElementById("fActor").addEventListener("input", () => {
    clearTimeout(actorTimer);
    actorTimer = setTimeout(reApply, 300);
  });

  document.getElementById("fYearFrom").addEventListener("change",  reApply);
  document.getElementById("fYearTo").addEventListener("change",    reApply);
  document.getElementById("fIndieOnly").addEventListener("change", reApply);
  document.getElementById("fHasPoster").addEventListener("change", reApply);
  document.querySelectorAll('input[name="fRuntime"]').forEach(r => r.addEventListener("change", reApply));
  document.querySelectorAll('input[name="fStatus"]').forEach(r  => r.addEventListener("change", reApply));

  document.getElementById("advReset").addEventListener("click", () => {
    document.getElementById("fYearFrom").value = "";
    document.getElementById("fYearTo").value   = "";
    document.getElementById("fActor").value    = "";
    document.getElementById("fIndieOnly").checked = false;
    document.getElementById("fHasPoster").checked = false;
    document.querySelector('input[name="fRuntime"][value=""]').checked = true;
    document.querySelector('input[name="fStatus"][value=""]').checked  = true;
    document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
    filterYearFrom = filterYearTo = filterGenre = filterRuntime = filterStatus = filterActor = "";
    filterIndieOnly = false;
    filterHasPoster = false;
    filteredResults = allSearchResults.slice();
    searchPage = 1;
    updateAdvToggleLabel();
    renderSearchPage();
    document.getElementById("resStat").textContent = `${allSearchResults.length}편`;
  });
}

/* ── 검색 결과 페이지 렌더 ──────────────────── */
function renderSearchPage() {
  const src        = filteredResults.length ? filteredResults : allSearchResults;
  const start      = (searchPage - 1) * PAGE_SIZE;
  const pageItems  = src.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(src.length / PAGE_SIZE);
  const grid       = document.getElementById("resGrid");

  grid.innerHTML = pageItems.map(m => cardHTML(m, false)).join("");
  bindCards(grid, pageItems, false);
  grid.scrollTop = 0;

  // 페이지네이션 UI
  const pg = document.getElementById("pagination");
  if (totalPages <= 1) { pg.innerHTML = ""; return; }

  const pages = [];
  // 항상 첫 페이지, 현재 ±2, 마지막 페이지 표시
  const show = new Set([1, totalPages,
    searchPage - 2, searchPage - 1, searchPage, searchPage + 1, searchPage + 2
  ].filter(p => p >= 1 && p <= totalPages));
  const sorted = [...show].sort((a, b) => a - b);

  let html = `<button class="pg-btn" id="pgPrev" ${searchPage === 1 ? "disabled" : ""}>←</button>`;
  let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) html += `<span class="pg-info">…</span>`;
    html += `<button class="pg-btn${p === searchPage ? " active" : ""}" data-page="${p}">${p}</button>`;
    prev = p;
  }
  html += `<button class="pg-btn" id="pgNext" ${searchPage === totalPages ? "disabled" : ""}>→</button>`;
  pg.innerHTML = html;

  pg.querySelectorAll("[data-page]").forEach(btn => {
    btn.addEventListener("click", () => { searchPage = parseInt(btn.dataset.page); renderSearchPage(); });
  });
  pg.querySelector("#pgPrev")?.addEventListener("click", () => { searchPage--; renderSearchPage(); });
  pg.querySelector("#pgNext")?.addEventListener("click", () => { searchPage++; renderSearchPage(); });
}

/* ── 영화 검색 ─────────────────────────────── */
/* ── 라이트박스 ─────────────────────────────── */
function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImg").src = "";
  document.body.style.overflow = "";
}
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox" || e.target.id === "lightboxClose") closeLightbox();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeLightbox();
  }
});

async function doSearch(rawQ, overrideType, tmdbMovieId = null) {
  const q = (rawQ || "").trim().replace(/\s+/g, " ");
  if (!q) {
    // 검색어 없어도 연도 필터가 있으면 브라우징 모드로 전환
    if (filterYearFrom || filterYearTo) { runBrowse(1); return; }
    toast("검색어를 입력하거나 연도 필터를 설정해주세요", "err");
    return;
  }
  if (overrideType) searchType = overrideType;
  activeCatId = null;
  renderSidebar();
  showScreen("results");

  document.getElementById("topInput").value = q;
  // 검색 타입 토글 버튼 UI 동기화
  document.querySelectorAll(".type-btn").forEach(b => b.classList.toggle("active", b.dataset.type === searchType));
  document.getElementById("resStat").textContent = "";
  document.getElementById("pagination").innerHTML = "";
  const grid = document.getElementById("resGrid");
  grid.innerHTML = `<div class="empty"><div class="spinner"></div>검색 중…</div>`;

  let param;
  if (searchType === "director") {
    param = `director=${encodeURIComponent(q)}${tmdbMovieId ? `&tmdbMovieId=${tmdbMovieId}` : ""}`;
  } else {
    param = `q=${encodeURIComponent(q)}&searchBy=${searchType}`;
  }

  try {
    const { results } = await apiGet(`/api/movies?${param}`);
    allSearchResults = results.slice().sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
    filteredResults  = applyFilters(allSearchResults);
    searchPage = 1;
    updateAdvToggleLabel();
    const total = allSearchResults.length;
    const shown = filteredResults.length;
    document.getElementById("resStat").textContent =
      shown !== total ? `${shown} / ${total}편` : `${total}편`;
    if (!filteredResults.length) {
      grid.innerHTML = `<div class="empty">${total ? "필터 조건에 맞는 결과가 없습니다." : "검색 결과가 없습니다."}</div>`;
      return;
    }
    renderSearchPage();
  } catch {
    grid.innerHTML = `<div class="empty">오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</div>`;
  }
}

async function openCatView(id) {
  activeCatId = id;
  renderSidebar();
  showScreen("cat");

  const cat = categories.find(c => c.id === id);
  document.getElementById("catBarTitle").textContent = cat?.name || "";
  document.getElementById("catBarCount").textContent = "";

  const grid = document.getElementById("catGrid");
  document.getElementById("catPagination").innerHTML = "";
  grid.innerHTML = `<div class="empty"><div class="spinner"></div>불러오는 중…</div>`;

  try {
    const rows = await apiGet(`/api/categories?catId=${id}`);
    allCatMovies = rows.map(r => r.movie_data);
    allCatRows   = rows;
    catPage      = 1;

    document.getElementById("catBarCount").textContent = `${allCatMovies.length}편`;
    if (cat) cat.movie_count = allCatMovies.length;

    if (!allCatMovies.length) {
      grid.innerHTML = `<div class="empty">아직 추가된 영화가 없습니다.<br>영화를 검색해서 이 카테고리에 추가해 보세요.</div>`;
      return;
    }

    renderCatPage();
  } catch {
    grid.innerHTML = `<div class="empty">불러오기 실패</div>`;
  }
}

function renderCatPage() {
  const start      = (catPage - 1) * PAGE_SIZE;
  const pageItems  = allCatMovies.slice(start, start + PAGE_SIZE);
  const pageRows   = allCatRows.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(allCatMovies.length / PAGE_SIZE);
  const grid       = document.getElementById("catGrid");

  grid.innerHTML = pageItems.map((m, i) => cardHTML(m, true, pageRows[i].id)).join("");
  bindCards(grid, pageItems, true, pageRows, activeCatId);
  grid.scrollTop = 0;

  const pg = document.getElementById("catPagination");
  if (totalPages <= 1) { pg.innerHTML = ""; return; }

  const show = new Set([1, totalPages,
    catPage - 2, catPage - 1, catPage, catPage + 1, catPage + 2
  ].filter(p => p >= 1 && p <= totalPages));
  const sorted = [...show].sort((a, b) => a - b);

  let html = `<button class="pg-btn" id="cpPrev" ${catPage === 1 ? "disabled" : ""}>←</button>`;
  let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) html += `<span class="pg-info">…</span>`;
    html += `<button class="pg-btn${p === catPage ? " active" : ""}" data-cpage="${p}">${p}</button>`;
    prev = p;
  }
  html += `<button class="pg-btn" id="cpNext" ${catPage === totalPages ? "disabled" : ""}>→</button>`;
  pg.innerHTML = html;

  pg.querySelectorAll("[data-cpage]").forEach(btn => {
    btn.addEventListener("click", () => { catPage = parseInt(btn.dataset.cpage); renderCatPage(); });
  });
  pg.querySelector("#cpPrev")?.addEventListener("click", () => { catPage--; renderCatPage(); });
  pg.querySelector("#cpNext")?.addEventListener("click", () => { catPage++; renderCatPage(); });
}

/* ── 포스터 없을 때 제목 플레이스홀더 ──────── */
const NP_GRADIENTS = [
  ["#1a1a2e","#0f3460"], ["#1a2a1a","#0d3b1e"],
  ["#2a1a1a","#3b0d0d"], ["#1e1a2e","#2d1b4e"],
  ["#1a2626","#0d3333"], ["#26201a","#3d2e10"],
];
function posterPlaceholder(title) {
  const idx = (title || "").split("").reduce((a,c) => a + c.charCodeAt(0), 0) % NP_GRADIENTS.length;
  const [c1, c2] = NP_GRADIENTS[idx];
  const safe = (title || "제목 미상").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return `<div class="no-poster" style="background:linear-gradient(160deg,${c1} 0%,${c2} 100%)">` +
    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,1)" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>` +
    `<span class="np-title">${safe}</span>` +
    `</div>`;
}

/* ── http → https URL 정규화 ─────────────── */
const toHttps = url => url ? url.replace(/^http:\/\//i, "https://") : url;

/* ── 카드 HTML ─────────────────────────────── */
function cardHTML(m, inCat, rowId = "") {
  const thumbSrc = toHttps(m.poster_url || (m.stills && m.stills[0]) || "");
  const titleAttr = (m.title || "").replace(/"/g, "&quot;");
  const img = thumbSrc
    ? `<img src="${thumbSrc}" alt="" loading="lazy" data-title="${titleAttr}" onerror="this.outerHTML=posterPlaceholder(this.dataset.title)">`
    : posterPlaceholder(m.title);
  const rm = inCat ? `<button class="card-rm" data-rowid="${rowId}">✕</button>` : "";
  const title = m.title || "제목 미상";
  const meta  = `${m.director || "—"} · ${m.year || "—"}`;
  return `
<div class="card" data-id="${m.id}">
  <div class="card-poster">${img}${rm}</div>
  <div class="card-info">
    <div class="card-title">${title}</div>
    <div class="card-meta">${meta}</div>
  </div>
</div>`;
}

/* ── 카드 이벤트 ───────────────────────────── */
function bindCards(grid, movies, inCat, rows = [], catId = null) {
  grid.querySelectorAll(".card").forEach((el, i) => {
    el.addEventListener("click", e => {
      if (e.target.closest(".card-rm")) return;
      showDetail(movies[i]);
    });

    const rm = el.querySelector(".card-rm");
    if (rm) {
      rm.addEventListener("click", async e => {
        e.stopPropagation();
        try {
          await apiDelete(`/api/categories?rowId=${rm.dataset.rowid}`);
          const cat = categories.find(c => c.id === catId);
          if (cat) cat.movie_count = Math.max(0, (cat.movie_count || 1) - 1);
          const idx = allCatRows.findIndex(r => String(r.id) === String(rm.dataset.rowid));
          if (idx !== -1) { allCatMovies.splice(idx, 1); allCatRows.splice(idx, 1); }
          document.getElementById("catBarCount").textContent = `${allCatMovies.length}편`;
          if (allCatMovies.length === 0) {
            document.getElementById("catGrid").innerHTML = `<div class="empty">아직 추가된 영화가 없습니다.<br>영화를 검색해서 이 카테고리에 추가해 보세요.</div>`;
            document.getElementById("catPagination").innerHTML = "";
          } else {
            if (catPage > Math.ceil(allCatMovies.length / PAGE_SIZE)) catPage = Math.max(1, catPage - 1);
            renderCatPage();
          }
          toast("카테고리에서 제거됨");
        } catch { toast("제거 실패", "err"); }
      });
    }
  });
}

async function runBrowse(page = 1) {
  if (!filterYearFrom && !filterYearTo) {
    toast("연도 필터를 먼저 설정해주세요", "err");
    return;
  }
  browseMode    = true;
  browsePageNum = page;
  showScreen("results");

  const grid = document.getElementById("resGrid");
  grid.innerHTML = `<div class="empty"><div class="spinner"></div>영화 목록 불러오는 중…</div>`;
  document.getElementById("resStat").textContent = "";
  document.getElementById("pagination").innerHTML = "";

  const params = new URLSearchParams({ page: String(page) });
  if (filterYearFrom) params.set("yearFrom", filterYearFrom);
  if (filterYearTo)   params.set("yearTo",   filterYearTo);
  if (filterGenre)    params.set("genre",     filterGenre);

  try {
    const data = await apiGet(`/api/movies?${params}`);
    browseTotalCount = data.total || 0;
    allSearchResults = data.results || [];
    filteredResults  = applyFilters(allSearchResults);
    searchPage = 1;
    updateAdvToggleLabel();

    const yearLabel = filterYearFrom === filterYearTo
      ? `${filterYearFrom}년`
      : `${filterYearFrom || "~"}–${filterYearTo || "~"}년`;
    document.getElementById("resStat").textContent =
      `${yearLabel} 독립영화 ${browseTotalCount}편 중 ${page}페이지`;

    renderSearchPage();
    renderBrowsePagination();
  } catch {
    grid.innerHTML = `<div class="empty">불러오기 실패</div>`;
  }
}

function renderBrowsePagination() {
  const pg         = document.getElementById("pagination");
  const totalPages = Math.ceil(browseTotalCount / 10);
  if (totalPages <= 1) { pg.innerHTML = ""; return; }

  const cur  = browsePageNum;
  const show = new Set([1, totalPages,
    cur - 2, cur - 1, cur, cur + 1, cur + 2
  ].filter(p => p >= 1 && p <= totalPages));
  const sorted = [...show].sort((a, b) => a - b);

  let html = `<button class="pg-btn" id="bpPrev" ${cur === 1 ? "disabled" : ""}>←</button>`;
  let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) html += `<span class="pg-info">…</span>`;
    html += `<button class="pg-btn${p === cur ? " active" : ""}" data-bpage="${p}">${p}</button>`;
    prev = p;
  }
  html += `<button class="pg-btn" id="bpNext" ${cur === totalPages ? "disabled" : ""}>→</button>`;
  pg.innerHTML = html;

  pg.querySelectorAll("[data-bpage]").forEach(btn =>
    btn.addEventListener("click", () => runBrowse(parseInt(btn.dataset.bpage)))
  );
  pg.querySelector("#bpPrev")?.addEventListener("click", () => runBrowse(cur - 1));
  pg.querySelector("#bpNext")?.addEventListener("click", () => runBrowse(cur + 1));
}

/* ── 검색 이벤트 ────────────────────────────── */
function bindSearch(inputId, btnId) {
  const run = () => {
    // change 이벤트 타이밍 문제 방지 — 클릭 시점에 DOM 값 직접 읽기
    filterYearFrom = document.getElementById("hfYearFrom")?.value.trim()
                  || document.getElementById("fYearFrom")?.value.trim()
                  || filterYearFrom;
    filterYearTo   = document.getElementById("hfYearTo")?.value.trim()
                  || document.getElementById("fYearTo")?.value.trim()
                  || filterYearTo;

    const q = document.getElementById(inputId).value.trim();
    if (!q && (filterYearFrom || filterYearTo)) {
      runBrowse(1);
    } else {
      browseMode = false;
      doSearch(q);
    }
  };
  document.getElementById(btnId).addEventListener("click", run);
  document.getElementById(inputId).addEventListener("keydown", e => { if (e.key === "Enter") run(); });
}
bindSearch("homeInput", "homeBtn");

  viewMode = btn.dataset.view;
  document.querySelectorAll(".vt-btn").forEach(b => b.classList.toggle("active", b.dataset.view === viewMode));
  document.querySelectorAll(".movie-grid").forEach(g => g.classList.toggle("list-view", viewMode === "list"));
  // 새 카드 HTML(card-info 포함)로 재렌더링

  else if (document.getElementById("catScreen").style.display !== "none") renderCatPage();
});

/* ── 홈 화면 필터 초기화 ─────────────────────── */
function initHomeFilters() {
  const toggle = document.getElementById("homeAdvToggle");
  const panel  = document.getElementById("homeAdvPanel");

  toggle.addEventListener("click", () => {
    const open = panel.classList.toggle("open");
    toggle.classList.toggle("open", open);
  });

  /* 상태 변수 업데이트만 (검색 전이므로 reApply 없음) */
  const updateState = () => {
    filterYearFrom  = document.getElementById("hfYearFrom").value.trim();
    filterYearTo    = document.getElementById("hfYearTo").value.trim();
    filterRuntime   = document.querySelector('input[name="hfRuntime"]:checked')?.value || "";
    filterStatus    = document.querySelector('input[name="hfStatus"]:checked')?.value  || "";
    filterActor     = document.getElementById("hfActor").value.trim();
    filterIndieOnly = document.getElementById("hfIndieOnly").checked;
    filterHasPoster = document.getElementById("hfHasPoster").checked;
    updateAdvToggleLabel();
  };

  /* 홈 장르 칩 */
  document.getElementById("hfGenreChips").addEventListener("click", e => {
    const chip = e.target.closest(".genre-chip");
    if (!chip) return;
    const genre = chip.dataset.genre;
    if (filterGenre === genre) {
      filterGenre = "";
      chip.classList.remove("active");
    } else {
      document.querySelectorAll("#hfGenreChips .genre-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      filterGenre = genre;
    }
    updateState();
  });

  let actorTimer;
  document.getElementById("hfActor").addEventListener("input", () => {
    clearTimeout(actorTimer);
    actorTimer = setTimeout(updateState, 300);
  });

  document.getElementById("hfYearFrom").addEventListener("change",  updateState);
  document.getElementById("hfYearTo").addEventListener("change",    updateState);
  document.getElementById("hfIndieOnly").addEventListener("change", updateState);
  document.getElementById("hfHasPoster").addEventListener("change", updateState);
  document.querySelectorAll('input[name="hfRuntime"]').forEach(r => r.addEventListener("change", updateState));
  document.querySelectorAll('input[name="hfStatus"]').forEach(r  => r.addEventListener("change", updateState));

  document.getElementById("homeAdvReset").addEventListener("click", () => {
    document.getElementById("hfYearFrom").value   = "";
    document.getElementById("hfYearTo").value     = "";
    document.getElementById("hfActor").value      = "";
    document.getElementById("hfIndieOnly").checked = false;
    document.getElementById("hfHasPoster").checked = false;
    document.querySelector('input[name="hfRuntime"][value=""]').checked = true;
    document.querySelector('input[name="hfStatus"][value=""]').checked  = true;
    document.querySelectorAll("#hfGenreChips .genre-chip").forEach(c => c.classList.remove("active"));
    filterYearFrom = filterYearTo = filterGenre = filterRuntime = filterStatus = filterActor = "";
    filterIndieOnly = false;
    filterHasPoster = false;
    updateAdvToggleLabel();
  });
}
