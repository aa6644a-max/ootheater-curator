<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오오극장 — 독립영화 기획전 큐레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
<style>
/* ── 디자인 토큰 ─────────────────────────────── */
:root {
  --bg:        #0b0b0f;
  --surface:   #13131a;
  --surface2:  #1c1c28;
  --border:    rgba(255,255,255,0.07);
  --accent:    #e8c97a;          /* 필름 골드 */
  --accent2:   #7a9be8;          /* 쿨 블루 */
  --danger:    #e87a7a;
  --text:      #e8e4dc;
  --muted:     #7a7870;
  --dim:       rgba(232,201,122,0.12);

  --card-w:    260px;
  --r:         4px;
  --font-ser:  'Noto Serif KR', serif;
  --font-mono: 'DM Mono', monospace;
}

/* ── 리셋 ────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ser);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 필름 스트립 배경 ─────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0, transparent 48px,
      rgba(255,255,255,0.012) 48px, rgba(255,255,255,0.012) 49px
    );
  pointer-events: none;
  z-index: 0;
}

/* ── 헤더 ────────────────────────────────────── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,11,15,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 2.5rem;
}
.header-inner {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 2rem;
  height: 64px;
}
.logo {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  flex-shrink: 0;
}
.logo-main {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: var(--accent);
}
.logo-sub {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.header-divider { flex: 1; }

/* 검색창 */
.search-wrap {
  position: relative;
  width: clamp(220px, 30vw, 420px);
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
#searchInput {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 0.55rem 0.9rem 0.55rem 2.4rem;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 0.02em;
}
#searchInput::placeholder { color: var(--muted); }
#searchInput:focus { border-color: var(--accent); }

/* 통계 뱃지 */
.stat {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
}
.stat span {
  color: var(--accent);
  font-weight: 400;
}

/* CSV 내보내기 버튼 */
.btn-csv {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 0.4rem 0.85rem;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-csv:hover { border-color: var(--accent2); color: var(--accent2); }

/* ── 서브헤더: 퀵 필터 ──────────────────────── */
.filters-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2.5rem;
}
.filters-inner {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.65rem 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters-inner::-webkit-scrollbar { display: none; }

.filter-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: 0.5rem;
}

.qf {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 0.35rem 0.85rem;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.03em;
}
.qf:hover { border-color: var(--accent); color: var(--accent); }
.qf.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 600;
}

/* 즐겨찾기 버튼 (카드 우상단 하트) */
.fav-btn {
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px;
  background: rgba(11,11,15,0.8);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  transition: all 0.15s;
  z-index: 2;
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1;
}
.fav-btn:hover { border-color: var(--danger); color: var(--danger); }
.fav-btn.active { border-color: var(--danger); color: var(--danger); background: rgba(232,122,122,0.15); }

/* ── 메인 레이아웃 ───────────────────────────── */
main {
  position: relative;
  z-index: 1;
  max-width: 1600px;
  margin: 0 auto;
  padding: 2rem 2.5rem 4rem;
}

/* ── 로딩 / 에러 / 빈 상태 ────────────────────── */
#statusMsg {
  text-align: center;
  padding: 6rem 0;
  font-family: var(--font-mono);
  color: var(--muted);
  font-size: 0.85rem;
  letter-spacing: 0.05em;
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 1.2rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 영화 그리드 ─────────────────────────────── */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
  gap: 1.25rem;
}

/* ── 카드 ────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.35s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(232,201,122,0.35);
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
}

/* 포스터 영역 */
.poster-wrap {
  position: relative;
  aspect-ratio: 2/3;
  background: var(--surface2);
  overflow: hidden;
}
.poster-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s;
}
.card:hover .poster-wrap img { transform: scale(1.04); }

/* 포스터 없을 때 플레이스홀더 */
.poster-placeholder {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  color: var(--muted);
}
.poster-placeholder svg { opacity: 0.25; }
.poster-placeholder span {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  opacity: 0.4;
}

/* 상태 뱃지 (포스터 위) */
.badge-status {
  position: absolute;
  top: 8px; left: 8px;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: rgba(11,11,15,0.85);
  color: var(--accent);
  border: 1px solid var(--accent);
  backdrop-filter: blur(4px);
}
.badge-status.unreleased { color: var(--danger); border-color: var(--danger); }
.badge-status.jeonju { color: var(--accent2); border-color: var(--accent2); }

/* 런타임 뱃지 */
.badge-runtime {
  position: absolute;
  bottom: 8px; right: 8px;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 3px 7px;
  background: rgba(11,11,15,0.82);
  color: var(--muted);
  border-radius: 2px;
  backdrop-filter: blur(4px);
}

/* 카드 본문 */
.card-body {
  padding: 0.9rem 1rem 1rem;
}
.card-title {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 0.25rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-dir {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  margin-bottom: 0.6rem;
}
.card-plot {
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0.7rem;
}
.card-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
}
.kw-tag {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  color: var(--accent);
  background: var(--dim);
  padding: 2px 6px;
  border-radius: 2px;
  letter-spacing: 0.04em;
}

/* ── 모달 ────────────────────────────────────── */
#modalOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 200;
  padding: 2rem;
  overflow-y: auto;
  backdrop-filter: blur(6px);
}
#modalOverlay.open { display: flex; align-items: flex-start; justify-content: center; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  max-width: 780px;
  width: 100%;
  margin: auto;
  overflow: hidden;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-top {
  display: flex;
  gap: 1.8rem;
  padding: 1.8rem;
  border-bottom: 1px solid var(--border);
}
.modal-poster {
  flex-shrink: 0;
  width: 160px;
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface2);
  aspect-ratio: 2/3;
}
.modal-poster img { width: 100%; height: 100%; object-fit: cover; }
.modal-info { flex: 1; }
.modal-title {
  font-size: 1.5rem;
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 0.4rem;
}
.modal-meta {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.modal-meta b { color: var(--text); }
.modal-plot {
  font-size: 0.82rem;
  line-height: 1.75;
  color: var(--muted);
  margin-bottom: 1rem;
}
.modal-kws { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.modal-close-wrap {
  padding: 1rem 1.8rem;
  display: flex;
  justify-content: flex-end;
}
.modal-close {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.45rem 1.1rem;
  cursor: pointer;
  border-radius: var(--r);
  transition: all 0.15s;
}
.modal-close:hover { border-color: var(--accent); color: var(--accent); }

/* ── 스크롤바 ────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 10px; }
</style>
</head>
<body>

<!-- ────────── 헤더 ────────── -->
<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-main">오오극장</span>
      <span class="logo-sub">독립영화 기획전 큐레이터</span>
    </div>
    <div class="header-divider"></div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="제목 · 감독 검색 후 Enter…" autocomplete="off" />
      <button id="btnSearch" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;font-family:var(--font-mono)">검색</button>
    </div>
    <div class="stat">표시 <span id="countShown">0</span> / 전체 <span id="countTotal">0</span> 편</div>
    <button class="btn-csv" id="btnCsv" title="현재 필터된 목록을 CSV로 내보내기">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      CSV
    </button>
  </div>
</header>

<!-- ────────── 퀵 필터 ────────── -->
<div class="filters-bar">
  <div class="filters-inner">
    <span class="filter-label">필터</span>
    <button class="qf active" data-filter="all">전체 보기</button>
    <button class="qf" data-filter="jeonju">2026 전주 상영작</button>
    <button class="qf" data-filter="unreleased">미개봉 · 제작완료</button>
    <button class="qf" data-filter="short">단편 (40분 미만)</button>
    <button class="qf" data-filter="feature">장편 (40분 이상)</button>
    <button class="qf" data-filter="noposter">포스터 미확보</button>
    <button class="qf" data-filter="favorites">즐겨찾기 ♥</button>
  </div>
</div>

<!-- ────────── 메인 ────────── -->
<main>
  <div id="statusMsg">
    <div class="spinner"></div>
    영화 데이터를 불러오는 중…
  </div>
  <div id="grid" style="display:none;"></div>
  <div id="loadMoreWrap" style="display:none;justify-content:center;padding:2rem 0;">
    <button id="btnLoadMore" class="qf" style="padding:0.6rem 2rem;font-size:0.8rem;">
      더 보기
    </button>
  </div>
</main>

<!-- ────────── 모달 ────────── -->
<div id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-poster" id="mPoster"></div>
      <div class="modal-info">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-meta" id="mMeta"></div>
        <div class="modal-plot" id="mPlot"></div>
        <div class="modal-kws" id="mKws"></div>
      </div>
    </div>
    <div class="modal-close-wrap">
      <button class="modal-close" id="modalCloseBtn">닫기 / ESC</button>
    </div>
  </div>
</div>

<script>
/* ── 전역 상태 ── */
let allMovies   = [];
let activeFilter = "all";
let searchQuery  = "";
let currentPage  = 1;
let totalCount   = 0;
let isLoading    = false;

/* ── 즐겨찾기 (localStorage) ── */
const FAV_KEY = "ootheater_favorites";
let favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"));

function saveFavorites() {
  localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
}

function toggleFavorite(id, event) {
  event.stopPropagation();
  favorites.has(id) ? favorites.delete(id) : favorites.add(id);
  saveFavorites();
  const btn = document.querySelector(`.fav-btn[data-id="${id}"]`);
  if (btn) btn.classList.toggle("active", favorites.has(id));
  if (activeFilter === "favorites") renderGrid();
}

/* ── API 호출 ── */
async function fetchFromAPI(query = "", director = "", page = 1) {
  const params = new URLSearchParams({ page });
  if (query)    params.set("q", query);
  if (director) params.set("director", director);
  const res = await fetch(`/api/movies?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ── 영화 로드 (reset=true면 새 검색, false면 다음 페이지) ── */
async function loadMovies(reset = true) {
  if (isLoading) return;
  isLoading = true;

  if (reset) {
    currentPage = 1;
    allMovies   = [];
    showLoading();
  }

  try {
    const { results, total } = await fetchFromAPI(searchQuery, "", currentPage);
    totalCount = total;
    allMovies  = reset ? results : [...allMovies, ...results];
    renderGrid();
  } catch (err) {
    console.error(err);
    showError();
  }
  isLoading = false;
}

function showLoading() {
  document.getElementById("grid").style.display = "none";
  document.getElementById("loadMoreWrap").style.display = "none";
  const s = document.getElementById("statusMsg");
  s.style.display = "block";
  s.innerHTML = `<div class="spinner"></div>영화 데이터를 불러오는 중…`;
}

function showError() {
  document.getElementById("grid").style.display = "none";
  document.getElementById("loadMoreWrap").style.display = "none";
  document.getElementById("statusMsg").innerHTML = `
    <div style="font-size:2rem;margin-bottom:1rem">⚠️</div>
    데이터를 불러오지 못했습니다.<br>
    <span style="font-size:0.7rem;color:var(--muted)">Vercel 배포 후 /api/movies 엔드포인트를 확인해 주세요.</span>
  `;
}

/* ── 클라이언트 필터링 ── */
function applyFilters(movies) {
  const q = searchQuery.trim().toLowerCase();
  return movies.filter(m => {
    if (activeFilter === "jeonju") {
      if (!(m.keywords || []).join(" ").toLowerCase().includes("전주")) return false;
    }
    if (activeFilter === "unreleased") {
      const st = (m.status || "").toLowerCase();
      if (!st.includes("미개봉") && !st.includes("제작완료") && !st.includes("개봉준비")) return false;
    }
    if (activeFilter === "short")    { if (!m.runtime || m.runtime >= 40) return false; }
    if (activeFilter === "feature")  { if (!m.runtime || m.runtime < 40)  return false; }
    if (activeFilter === "noposter") { if (m.poster_url) return false; }
    if (activeFilter === "favorites"){ if (!favorites.has(m.id)) return false; }
    if (q) {
      const hay = [m.title, m.director, m.plot, ...(m.keywords||[])].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ── 카드 생성 ── */
function badgeStatus(status) {
  if (!status) return "";
  const s = status.toLowerCase();
  const cls = (s.includes("미개봉") || s.includes("제작완료")) ? "unreleased" : "";
  return `<span class="badge-status ${cls}">${status}</span>`;
}

function badgeJeonju(keywords = []) {
  return keywords.some(k => k.includes("전주"))
    ? `<span class="badge-status jeonju">전주</span>` : "";
}

function renderCard(m, idx) {
  const poster = m.poster_url
    ? `<img src="${m.poster_url}" alt="${m.title} 포스터" loading="lazy" onerror="this.parentElement.innerHTML='<div class=poster-placeholder><svg width=32 height=32 viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"1\\"><rect x=\\"2\\" y=\\"3\\" width=\\"20\\" height=\\"14\\" rx=\\"2\\"/><path d=\\"M8 21h8M12 17v4\\"/></svg><span>NO POSTER</span></div>'" />`
    : `<div class="poster-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>NO POSTER</span></div>`;

  const runtime = m.runtime ? `<span class="badge-runtime">${m.runtime}분</span>` : "";
  const isFav   = favorites.has(m.id);
  const favBtn  = `<button class="fav-btn${isFav ? " active" : ""}" data-id="${m.id}" title="즐겨찾기">♥</button>`;
  const kwTags  = (m.keywords || []).slice(0, 4).map(k => `<span class="kw-tag">${k}</span>`).join("");
  const genre   = m.genre ? `<span class="kw-tag" style="color:var(--accent2)">${m.genre}</span>` : "";

  return `
<div class="card" data-idx="${idx}" style="animation-delay:${Math.min(idx*30,400)}ms">
  <div class="poster-wrap">
    ${poster}${badgeStatus(m.status)}${badgeJeonju(m.keywords)}${runtime}${favBtn}
  </div>
  <div class="card-body">
    <div class="card-title">${m.title || "제목 미상"}</div>
    <div class="card-dir">${m.director || "감독 미상"} · ${m.year || "—"}</div>
    <div class="card-plot">${m.plot || "줄거리 정보가 없습니다."}</div>
    <div class="card-keywords">${genre}${kwTags}</div>
  </div>
</div>`;
}

/* ── 그리드 렌더 ── */
function renderGrid() {
  const filtered = applyFilters(allMovies);
  const grid     = document.getElementById("grid");
  const status   = document.getElementById("statusMsg");
  const lmWrap   = document.getElementById("loadMoreWrap");

  document.getElementById("countShown").textContent = filtered.length;
  document.getElementById("countTotal").textContent  = totalCount || allMovies.length;

  if (filtered.length === 0) {
    grid.style.display  = "none";
    lmWrap.style.display = "none";
    status.style.display = "block";
    status.innerHTML = `<div style="font-size:2rem;margin-bottom:1rem">🎞</div>조건에 맞는 영화가 없습니다.`;
    return;
  }

  status.style.display = "none";
  grid.style.display   = "grid";
  grid.innerHTML = filtered.map((m, i) => renderCard(m, i)).join("");

  grid.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openModal(filtered[parseInt(el.dataset.idx)]));
  });
  grid.querySelectorAll(".fav-btn").forEach(btn => {
    btn.addEventListener("click", e => toggleFavorite(btn.dataset.id, e));
  });

  // 더 보기 버튼
  const hasMore = allMovies.length < totalCount;
  lmWrap.style.display = hasMore ? "flex" : "none";
}

/* ── 모달 ── */
function openModal(m) {
  const poster = m.poster_url
    ? `<img src="${m.poster_url}" alt="${m.title}" />`
    : `<div class="poster-placeholder" style="height:100%"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>`;

  document.getElementById("mPoster").innerHTML = poster;
  document.getElementById("mTitle").textContent = m.title || "제목 미상";
  document.getElementById("mMeta").innerHTML = [
    m.director ? `<span>감독 <b>${m.director}</b></span>` : "",
    m.year     ? `<span>제작연도 <b>${m.year}</b></span>`  : "",
    m.runtime  ? `<span>상영시간 <b>${m.runtime}분</b></span>` : "",
    m.status   ? `<span>상태 <b>${m.status}</b></span>`   : "",
    m.genre    ? `<span>장르 <b>${m.genre}</b></span>`    : "",
  ].filter(Boolean).join("");
  document.getElementById("mPlot").textContent = m.plot || "줄거리 정보 없음.";
  document.getElementById("mKws").innerHTML = (m.keywords || []).map(k =>
    `<span class="kw-tag">${k}</span>`
  ).join("");

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ── 퀵 필터 ── */
document.querySelectorAll(".qf").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".qf").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderGrid();
  });
});

/* ── 검색 (엔터 or 버튼) ── */
function triggerSearch() {
  searchQuery = document.getElementById("searchInput").value;
  loadMovies(true);
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") triggerSearch();
});
document.getElementById("btnSearch").addEventListener("click", triggerSearch);

/* ── 더 보기 ── */
document.getElementById("btnLoadMore").addEventListener("click", () => {
  currentPage++;
  loadMovies(false);
});

/* ── CSV 내보내기 ── */
function exportCSV() {
  const filtered = applyFilters(allMovies);
  if (!filtered.length) { alert("내보낼 데이터가 없습니다."); return; }

  const headers = ["id","title","director","year","runtime","status","genre","poster_url","plot","keywords"];
  const escape  = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows    = filtered.map(m => headers.map(h => {
    const v = m[h];
    return escape(Array.isArray(v) ? v.join(" | ") : v);
  }).join(","));

  const csv  = "﻿" + [headers.join(","), ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `오오극장_큐레이션_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("btnCsv").addEventListener("click", exportCSV);

/* ── 초기 로드 ── */
loadMovies(true);
</script>
